[alembic]
# Alembic configuration for the AI Doctor Follow-Up local demo database.
# The URL is resolved at runtime by env.py (settings / ALEMBIC_DATABASE_URL),
# never hardcoded here, so the same migrations run in tests, CI and on Windows.
script_location = %(here)s
# Resolve the backend directory relative to THIS file, so `alembic -c
# backend/migrations/alembic.ini` works from any working directory
# (Windows paths with spaces included).
prepend_sys_path = %(here)s/..
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
