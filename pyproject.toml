[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-doctor-followup-backend"
version = "0.1.0"
description = "EDUCATIONAL / SYNTHETIC DATA / NOT FOR CLINICAL USE. Local FastAPI backend for the AI Doctor Follow-Up academic demo (Phases 1-3)."
readme = "README.md"
# Project license is an owner decision pending at P1 (docs/contracts/DEPENDENCIES.md §7).
# No license file is committed and no license metadata is asserted here.
requires-python = ">=3.12,<3.13"

# Direct runtime dependencies. Versions are exact pins; P1 pins were verified
# against pypi.org metadata on 2026-11-14 (see docs/phase-reports/PHASE_1_REPORT.md §5)
# and the P3 additions on 2026-11-15 (see docs/phase-reports/PHASE_3_REPORT.md §5).
dependencies = [
    "fastapi==0.162.7",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    # --- P3: document ingestion and extraction (owner decision D-01) --------
    # Multipart parsing for the upload route. Starlette delegates to this
    # package; without it FastAPI's form handling raises at import time.
    "python-multipart==0.0.33",
    # PDF text layer. Pure Python, no system binary, so the text-first path
    # works on a host with no Poppler or Tesseract installed.
    "pypdf==7.1.0",
    # PDF page rasterization for the OCR path. Bundles its own PDFium binary,
    # so it needs no Poppler install; verified on Windows in ASM-01.
    "pypdfium2==5.15.2",
    # OCR engine binding. The *engine* is a system prerequisite, not a wheel:
    # when it is absent, extraction degrades to E_DEPENDENCY_MISSING.
    "pytesseract==0.3.13",
    # Image decode and the deterministic grayscale/upscale preprocessing.
    "pillow==13.0.0",
    # --- P5-S2-A0 experimental candidate pins ---
    "langgraph==1.2.24",
    "langgraph-checkpoint==4.3.2",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-core==1.5.6",
    "langsmith==0.11.2",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
# Development / verification tooling. Installed only for tests, lint and CI.
dev = [
    "pytest==9.2.0",
    # Starlette 1.10 deprecates `httpx` for its TestClient and requires `httpx2`.
    "httpx2==2.16.0",
    "ruff==0.17.5",
    "pyyaml==6.0.3",
    # Required by `pip install -e . --no-build-isolation` (pip no longer
    # depends on wheel itself).
    "wheel==0.48.0",
    "setuptools==84.2.1",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
namespaces = true

[tool.setuptools.package-dir]
"" = "backend"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
pythonpath = ["backend"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts/python"]
# P0 contract documents are reviewed, owner-approved prose: formatting them is
# not part of P1 scope and would create unreviewed documentation churn.
extend-exclude = ["backend/migrations/versions", "*.md", "docs/**"]

[tool.ruff.lint]
# Import sorting (I) is required by ADR-0001: layering must stay auditable.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # Formatter-compatible line length handling.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
