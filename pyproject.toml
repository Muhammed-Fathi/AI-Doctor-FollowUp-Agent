[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-doctor-followup-backend"
version = "0.1.0"
description = "EDUCATIONAL / SYNTHETIC DATA / NOT FOR CLINICAL USE. Local FastAPI backend for the AI Doctor Follow-Up academic demo (Phase 1 foundation only)."
readme = "README.md"
# Project license is an owner decision pending at P1 (docs/contracts/DEPENDENCIES.md §7).
# No license file is committed and no license metadata is asserted here.
requires-python = ">=3.12,<3.13"

# Direct runtime dependencies. Versions are exact pins verified against pypi.org
# metadata on 2026-11-14 (see docs/phase-reports/PHASE_1_REPORT.md §5).
dependencies = [
    "fastapi==0.162.7",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
]

[project.optional-dependencies]
# Development / verification tooling. Installed only for tests, lint and CI.
dev = [
    "pytest==9.2.0",
    # Starlette 1.10 deprecates `httpx` for its TestClient and requires `httpx2`.
    "httpx2==2.16.0",
    "ruff==0.17.5",
    "pyyaml==6.0.3",
    # Required by `pip install -e . --no-build-isolation` (pip no longer
    # depends on wheel itself).
    "wheel==0.48.0",
    "setuptools==84.2.1",
]

[tool.setuptools]
# The backend is a local application, not a distributed library: only the
# `app` package is packaged, and tests/migrations stay out of the wheel.
packages = ["app"]

[tool.setuptools.package-dir]
"" = "backend"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
pythonpath = ["backend"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts/python"]
# P0 contract documents are reviewed, owner-approved prose: formatting them is
# not part of P1 scope and would create unreviewed documentation churn.
extend-exclude = ["backend/migrations/versions", "*.md", "docs/**"]

[tool.ruff.lint]
# Import sorting (I) is required by ADR-0001: layering must stay auditable.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # Formatter-compatible line length handling.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
